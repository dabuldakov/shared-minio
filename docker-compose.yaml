services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DOMAIN: ${MINIO_HOST}
      # Метрики Prometheus без bearer-токена: endpoint доступен только через
      # loopback/SSH-туннель (порт публикуется на 127.0.0.1), наружу не торчит.
      MINIO_PROMETHEUS_AUTH_TYPE: public
    env_file:
      - .env
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - shared-minio

networks:
  # Общая сеть с chat и makeup. Создаётся deploy'ем идемпотентно
  # (`docker network create shared-minio || true`).
  shared-minio:
    external: true
    name: shared-minio

volumes:
  # Нейтральный том, не привязан к проекту приложения. Данные должны переживать
  # пересоздание compose, поэтому том внешний (создаётся в deploy идемпотентно).
  minio_data:
    external: true
    name: shared-minio-data
